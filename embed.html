    <title>House Control</title>
    <script>// Runs before the House Control bundle when the page is embedded in a Home Assistant
// card (embed.html?embed=ha#<plan>). It stands in for the native shell: the plan comes
// from the URL hash, and the "native" message channel is the parent window, where the
// card turns commands into Home Assistant service calls and reports device states back.
(function () {
  var params = new URLSearchParams(location.search);
  if (!params.has('embed')) return;
  document.documentElement.classList.add('embed');

  var config = null;
  try {
    var b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    config = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) {
    console.error('[house-embed] cannot read the plan from the URL', e);
  }
  window.__HOUSE_BOOT__ = config ? { config: config, plan: 'custom', platform: 'web' } : { plan: 'home', platform: 'web' };

  var host = window.parent;
  if (!host || host === window) return; // opened on its own: behave like the plain web demo

  window.webkit = window.webkit || {};
  window.webkit.messageHandlers = window.webkit.messageHandlers || {};
  window.webkit.messageHandlers.house = {
    postMessage: function (msg) {
      try { host.postMessage({ __house: 1, msg: JSON.parse(JSON.stringify(msg)) }, '*'); } catch (e) { /* ignore */ }
    },
  };

  // The edit trigger lives next to the home title, but file handling and HA access
  // stay in the trusted parent. This bridge never receives credentials.
  var editorState = { open: false, preview: false, busy: false };
  var editButton = null;
  function updateEditorButton(state) {
    editorState = state || editorState;
    if (!editButton) return;
    editButton.setAttribute('aria-expanded', String(Boolean(editorState.open)));
    editButton.classList.toggle('active', Boolean(editorState.open));
    editButton.classList.toggle('has-preview', Boolean(editorState.preview));
    var label = editorState.open ? '收起地图编辑工具' : '展开地图编辑工具';
    if (editorState.preview) label += '（只读预览，设备控制已暂停）';
    editButton.setAttribute('aria-label', label);
    editButton.title = label;
    if (editorState.restoreFocus) editButton.focus({ preventScroll: true });
  }
  var observer = new MutationObserver(function () {
    var name = document.querySelector('.home-name');
    if (!name || editButton) return;
    var row = document.createElement('div');
    row.className = 'home-name-row';
    name.parentNode.insertBefore(row, name);
    row.appendChild(name);
    editButton = document.createElement('button');
    editButton.className = 'ha-edit-trigger';
    editButton.type = 'button';
    editButton.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#202127"/><circle cx="15" cy="17" r="2.5" fill="#202127"/></svg>';
    editButton.onclick = function () { window.webkit.messageHandlers.house.postMessage({ type: 'toggleEdit' }); };
    row.appendChild(editButton);
    updateEditorButton(editorState);
    observer.disconnect();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });

  window.addEventListener('message', function (e) {
    if (e.source !== host || !e.data || !e.data.__houseHost) return;
    if (e.data.fn === 'setEditorState') { updateEditorButton(e.data.args && e.data.args[0]); return; }
    var fn = window.house && window.house[e.data.fn];
    if (typeof fn === 'function') fn.apply(null, e.data.args || []);
  });
})();
</script>

    <style>/* House Control inside a Home Assistant card: fill the card instead of floating as a popover. */
html.embed body { background: #0a0e1a; }
html.embed #app { padding: 0; place-items: stretch; }
html.embed .card,
html.embed.native .card {
  width: 100%;
  height: 100%;
  max-width: none;
  border-radius: 0;
  box-shadow: none;
}
html.embed .card-clip { box-shadow: none; }
html.embed .notch { display: none; }
/* The plan menu (demo plans, editor, quit…) belongs to the Mac app, and the one-tap
   "everything on / off" power button is too easy to hit on a wall tablet: neither is shown here. */
html.embed .top button.round { display: none; }
html.embed .home > div:not(.home-badge) { min-width: 0; }
html.embed .home-name-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
html.embed .home-name-row .home-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
html.embed .ha-edit-trigger {
  position: relative; flex: none; width: 28px; height: 28px; padding: 0;
  display: grid; place-items: center; border-radius: 50%; pointer-events: auto;
  color: #b0b3bf; background: rgba(32, 33, 39, .78); border: 1px solid rgba(255, 255, 255, .1);
  transition: color .2s, background .2s, box-shadow .25s, transform .25s;
}
html.embed .ha-edit-trigger:hover { background: #30323b; color: #fff; }
html.embed .ha-edit-trigger:active { transform: scale(.9); }
html.embed .ha-edit-trigger.active { background: #303744; color: #bcd7ff; box-shadow: 0 0 0 3px #7faaff18; }
html.embed .ha-edit-trigger.has-preview::after { content: ''; position: absolute; right: -1px; top: -1px; width: 6px; height: 6px; border-radius: 50%; background: #f1bf6b; box-shadow: 0 0 8px #f1bf6b66; }
html.embed .ha-edit-trigger:focus-visible { outline: 2px solid #8bbcff; outline-offset: 3px; }
/* Web-only: omit the scene shortcuts and reclaim their row for device controls. */
html.embed .panel > .scenes { display: none; }
html.embed .panel > .rooms { margin-top: 0; }

/* Wide card (a dashboard column or more): the model on the left, the controls on the right. */
@media (min-width: 760px) {
  html.embed .card { --side: min(420px, 44%); --stage-h: 100%; }
  html.embed .stage { inset: 0 var(--side) 0 0; height: auto; }
  html.embed .stage canvas {
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 88%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 0%, #000 88%, transparent 100%);
  }
  html.embed .panel,
  html.embed .sheet { inset: 74px 0 0 auto; width: var(--side); }
  html.embed .panel-toast { left: auto; right: 16px; width: calc(var(--side) - 32px); }
}
</style>
